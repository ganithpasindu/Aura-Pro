name: Build & Deploy Web Flasher

on:
  release:
    types: [published, edited]
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Web Flasher site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site/firmware
          
          # GitHub Releases API මගින් සියලුම releases ලබාගෙන aura_pro_esp32_web.bin download කිරීම
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/releases" > releases.json

          python3 - << 'EOF'
          import json, os, urllib.request

          with open("releases.json") as f:
              releases = json.load(f)

          target_name = "aura_pro_esp32_web.bin"
          versions = []

          for rel in releases:
              if rel.get("draft"):
                  continue
              tag = rel["tag_name"]
              name = rel.get("name") or tag
              for asset in rel.get("assets", []):
                  if asset["name"] == target_name:
                      folder = f"_site/firmware/{tag}"
                      os.makedirs(folder, exist_ok=True)
                      dest = f"{folder}/{target_name}"
                      urllib.request.urlretrieve(asset["browser_download_url"], dest)
                      versions.append({
                          "version": tag,
                          "label": f"{tag} - {name}" if name != tag else tag,
                          "path": f"firmware/{tag}/{target_name}"
                      })
                      break

          with open("_site/versions.json", "w") as f:
              json.dump(versions, f, indent=2)
          EOF

          cp index.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
